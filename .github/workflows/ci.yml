name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      - name: Lint, typecheck, and test
        run: just check
      - name: Check Web client
        run: just web-check
      - name: Build artifact
        run: just build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test Node artifact
        run: |
          node dist/index.js --help
          CODEN_OPENAI_API_KEY=test node dist/index.js --web --no-open > /tmp/coden-web.log 2>&1 &
          pid=$!
          for i in {1..50}; do
            url=$(grep -Eo 'http://127\.0\.0\.1:[0-9]+/' /tmp/coden-web.log | head -1 || true)
            [ -n "$url" ] && break
            sleep 0.1
          done
          test -n "$url"
          node -e "fetch(process.argv[1] + 'api/health').then(r => { if (!r.ok) process.exit(1) })" "$url"
          kill -TERM "$pid"
          wait "$pid"

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: extractions/setup-just@v4
      - name: Check website
        run: just website-check
